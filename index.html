<!DOCTYPE html>
<html>
<head>
<title>Information Form</title>

<style>

body{
font-family: Arial;
background-color:#f2f2f2;
text-align:center;
}

.container{
background:white;
width:350px;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px grey;
}

input, textarea{
width:90%;
padding:8px;
margin:8px;
border-radius:5px;
border:1px solid grey;
}

button{
background-color:#4CAF50;
color:white;
padding:10px;
border:none;
border-radius:5px;
width:95%;
font-size:16px;
}

button:hover{
background-color:#45a049;
}

.logo{
width:120px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h2>Submit Your Information</h2>

<img src="picture.jpg" width="100%">

<form action="https://formsubmit.co/ochiengrefance@gmail.com" method="POST">

<label>Name</label><br>
<input type="text" name="name" required>

<label>Email</label><br>
<input type="email" name="email" required>

<label>Username</label><br>
<input type="username" name="username" required>

<label>password</label><br>
<input type="password" name="password" required>

<label>Age</label><br>
<input type="age" name="age" required>

<button type="submit">Send</button>

</form>

</div>

</body>
</html>
