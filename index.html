<!DOCTYPE html>
<html>
<head>
<title>Information Form</title>

<style>

body{
font-family: Arial;
background:
linear-gradient(135deg,#4CAF50,#2e7d32):
text-align:center;
padding-top:40px;
}

.container{
background:white;
width:380px;
margin:auto;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,2);
}

h2{
color:#333;
}

input, textarea{
width:92%;
padding:10px;
margin:8px;
border-radius:6px;
border:1px solid#ccc;
}

button{
background-color:#4CAF50;
color:white;
padding:12px;
border:none;
border-radius:6px;
width:95%;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#388e3c;
}

.logo{
width:100px;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h2>Submit Your Information</h2>

<img src="picture.jpg" width="100%">

<form 
action="https://formsubmit.co/ochiengrefance@gmail.com" method="POST">

<input type="hidden" name="_captcha"
value="false">
<input type="hidden" name="_template"
value="table">

<label>Name</label><br>
<input type="text" name="name" required>

<label>Email</label><br>
<input type="email" name="email" required>

<label>Username</label><br>
<input type="username" name="username" required>

<label>password</label><br>
<input type="password" name="password" required>

<label>Age</label><br>
<input type="age" name="age" required>

<button type="submit">Send</button>

</form>

</div>

</body>
</html>
